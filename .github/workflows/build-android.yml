name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies, test, and build userscript asset
        run: npm install && npm run check

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests and build Android APKs
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanTube-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanTube-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
